name: release-docker-arff-to-pq

on:
  # Only manually triggered
  workflow_dispatch:
    inputs:
      docker_tag:
        description: "Start with a 'v', e.g., 'v1.2.3'."
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  docker:

    runs-on: ubuntu-latest

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          sparse-checkout: 'arff-to-pq'

      - name: Extract metadata (labels) for Docker Hub
        id: meta_dockerhub
        uses: docker/metadata-action@v6
        with:
          images: "openml/openml-arff-to-pq"

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: arff-to-pq
          file: arff-to-pq/docker/Dockerfile
          tags: openml/openml-arff-to-pq:${{ github.event.inputs.docker_tag }}
          labels: ${{ steps.meta_dockerhub.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          push: true

      - name: Update repo description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: openml/openml-arff-to-pq
          short-description: "Converting arff images to parquet."
          readme-filepath: ./arff-to-pq/docker/README.md

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

[project]
name = "openml-arff-to-pq"
version = "1.3.0"
authors = [
  { name="Pieter Gijsbers" },
  { name="Prabhant Singh" },
  { name="Jos van der Velde" },
]
description = "Conversion of arff files to parquet."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "boto3==1.43.114",
    "loguru==0.7.3",
    "openml==0.15.1",
    "pandas==3.0.6",
    "python-dotenv==1.2.4",
    "liac-arff==2.5.0"
]

[project.optional-dependencies]
dev = [
    "boto3-stubs[s3]==1.43.114"
]
tests = [
    "pytest==9.1.1",
]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY",  # we do not require copyright in every file
]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = [
  "src"
]